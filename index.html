<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kramer Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
        }

        .browser-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Tab Bar */
        .tab-bar {
            background: #252525;
            height: 40px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .tabs-container {
            flex: 1;
            display: flex;
            overflow-x: auto;
            overflow-y: hidden;
            margin-left: 10px;
        }

        .tabs-container::-webkit-scrollbar {
            height: 0;
        }

        .tab {
            background: #2d2d2d;
            border: none;
            color: #ffffff;
            padding: 8px 15px;
            margin-right: 1px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            max-width: 200px;
            min-width: 120px;
            font-size: 12px;
            transition: background 0.2s;
        }

        .tab:hover {
            background: #404040;
        }

        .tab.active {
            background: #0078d4;
        }

        .tab-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-right: 8px;
        }

        .tab-close {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .tab-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .new-tab-btn {
            background: #2d2d2d;
            border: none;
            color: #ffffff;
            width: 30px;
            height: 30px;
            margin: 0 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .new-tab-btn:hover {
            background: #404040;
        }

        /* Navigation Bar */
        .nav-bar {
            background: #2d2d2d;
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 5px;
            border-bottom: 1px solid #333;
        }

        .nav-btn {
            background: #2d2d2d;
            border: none;
            color: #ffffff;
            width: 40px;
            height: 35px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover {
            background: #404040;
        }

        .nav-btn:active {
            background: #505050;
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .url-bar {
            flex: 1;
            background: #3c3c3c;
            border: 1px solid #555555;
            border-radius: 20px;
            color: #ffffff;
            padding: 8px 15px;
            font-size: 13px;
            margin: 0 10px;
            outline: none;
            transition: border-color 0.2s;
        }

        .url-bar:focus {
            border-color: #0078d4;
        }

        /* WebView Container */
        .webview-container {
            flex: 1;
            position: relative;
            background: #1e1e1e;
        }

        .webview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        .webview.active {
            display: block;
        }

        /* Loading Indicator */
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 14px;
        }

        .spinner {
            border: 2px solid #333;
            border-top: 2px solid #0078d4;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="browser-container">
        <!-- Tab Bar -->
        <div class="tab-bar">
            <div class="tabs-container" id="tabsContainer">
                <!-- Tabs will be added dynamically -->
            </div>
            <button class="new-tab-btn" onclick="createNewTab()">+</button>
        </div>

        <!-- Navigation Bar -->
        <div class="nav-bar">
            <button class="nav-btn" id="backBtn" onclick="goBack()">←</button>
            <button class="nav-btn" id="forwardBtn" onclick="goForward()">→</button>
            <button class="nav-btn" onclick="refresh()">⟳</button>
            <input type="text" class="url-bar" id="urlBar" placeholder="Search or enter address" onkeydown="handleUrlKeyDown(event)">
            <button class="nav-btn" onclick="goHome()">🏠</button>
            <button class="nav-btn" onclick="showMenu()">⋮</button>
        </div>

        <!-- WebView Container -->
        <div class="webview-container" id="webviewContainer">
            <div class="loading-indicator" id="loadingIndicator" style="display: none;">
                <div class="spinner"></div>
                Loading...
            </div>
        </div>
    </div>

    <script>
        class BrowserTab {
            constructor(id) {
                this.id = id;
                this.title = 'New Tab';
                this.url = 'https://www.google.com';
                this.webview = null;
                this.tabElement = null;
                this.isLoading = false;
                this.canGoBack = false;
                this.canGoForward = false;
            }
        }

        let tabs = [];
        let activeTab = null;
        let tabCounter = 0;
        const HOME_URL = 'https://www.google.com';

        // Set up Electron menu handlers
        if (window.electronAPI) {
            window.electronAPI.onMenuNewTab(() => createNewTab());
            window.electronAPI.onMenuCloseTab(() => {
                if (activeTab) closeTab(activeTab.id, { stopPropagation: () => {} });
            });
            window.electronAPI.onMenuGoBack(() => goBack());
            window.electronAPI.onMenuGoForward(() => goForward());
            window.electronAPI.onMenuRefresh(() => refresh());
            window.electronAPI.onMenuGoHome(() => goHome());
            window.electronAPI.onMenuAbout(() => showAbout());
        }

        function createNewTab(url = HOME_URL) {
            const tab = new BrowserTab(++tabCounter);
            tabs.push(tab);

            // Create tab button
            const tabElement = document.createElement('div');
            tabElement.className = 'tab';
            tabElement.innerHTML = `
                <span class="tab-title">${tab.title}</span>
                <button class="tab-close" onclick="closeTab(${tab.id}, event)">×</button>
            `;
            tabElement.onclick = () => switchToTab(tab.id);
            tab.tabElement = tabElement;

            document.getElementById('tabsContainer').appendChild(tabElement);

            // Create webview using Electron's webview tag
            const webview = document.createElement('webview');
            webview.className = 'webview';
            webview.src = url;
            webview.setAttribute('webpreferences', 'contextIsolation=yes');
            webview.setAttribute('allowpopups', 'true');
            webview.style.width = '100%';
            webview.style.height = '100%';
            
            // Set up webview event handlers
            webview.addEventListener('dom-ready', () => handleWebViewLoad(tab));
            webview.addEventListener('page-title-updated', (e) => updateTabTitle(tab, e.title));
            webview.addEventListener('did-navigate', (e) => {
                tab.url = e.url;
                if (tab === activeTab) {
                    document.getElementById('urlBar').value = e.url;
                }
                updateNavigationState(tab);
            });
            webview.addEventListener('did-navigate-in-page', (e) => {
                tab.url = e.url;
                if (tab === activeTab) {
                    document.getElementById('urlBar').value = e.url;
                }
            });
            webview.addEventListener('new-window', (e) => {
                createNewTab(e.url);
            });

            tab.webview = webview;
            document.getElementById('webviewContainer').appendChild(webview);

            switchToTab(tab.id);
        }

        function switchToTab(tabId) {
            const tab = tabs.find(t => t.id === tabId);
            if (!tab) return;

            // Hide all webviews and deactivate tabs
            tabs.forEach(t => {
                if (t.webview) t.webview.classList.remove('active');
                if (t.tabElement) t.tabElement.classList.remove('active');
            });

            // Show current tab
            tab.webview.classList.add('active');
            tab.tabElement.classList.add('active');
            activeTab = tab;

            // Update URL bar
            document.getElementById('urlBar').value = tab.url;
            updateNavigationButtons();
        }

        function closeTab(tabId, event) {
            event.stopPropagation();
            
            if (tabs.length <= 1) return; // Don't close last tab

            const tabIndex = tabs.findIndex(t => t.id === tabId);
            if (tabIndex === -1) return;

            const tab = tabs[tabIndex];
            
            // Remove elements
            tab.tabElement.remove();
            tab.webview.remove();
            
            // Remove from array
            tabs.splice(tabIndex, 1);

            // Switch to another tab if this was active
            if (activeTab && activeTab.id === tabId) {
                const nextTab = tabs[Math.min(tabIndex, tabs.length - 1)];
                switchToTab(nextTab.id);
            }
        }

        function handleWebViewLoad(tab) {
            tab.isLoading = false;
            updateNavigationState(tab);
        }

        function updateTabTitle(tab, title) {
            tab.title = title && title.length > 20 ? title.substring(0, 20) + '...' : (title || 'New Tab');
            const titleElement = tab.tabElement.querySelector('.tab-title');
            if (titleElement) {
                titleElement.textContent = tab.title;
            }
        }

        function updateNavigationState(tab) {
            if (tab.webview) {
                tab.canGoBack = tab.webview.canGoBack();
                tab.canGoForward = tab.webview.canGoForward();
                if (tab === activeTab) {
                    updateNavigationButtons();
                }
            }
        }

        function updateNavigationButtons() {
            document.getElementById('backBtn').disabled = !activeTab?.canGoBack;
            document.getElementById('forwardBtn').disabled = !activeTab?.canGoForward;
        }

        function goBack() {
            if (activeTab && activeTab.webview && activeTab.canGoBack) {
                activeTab.webview.goBack();
            }
        }

        function goForward() {
            if (activeTab && activeTab.webview && activeTab.canGoForward) {
                activeTab.webview.goForward();
            }
        }

        function refresh() {
            if (activeTab && activeTab.webview) {
                activeTab.webview.reload();
            }
        }

        function goHome() {
            navigateToUrl(HOME_URL);
        }

        function navigateToUrl(url) {
            if (!activeTab) return;

            // Add protocol if missing
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                if (!url.includes('.') || url.includes(' ')) {
                    url = `https://www.google.com/search?q=${encodeURIComponent(url)}`;
                } else {
                    url = 'https://' + url;
                }
            }

            activeTab.url = url;
            activeTab.webview.src = url;
            document.getElementById('urlBar').value = url;
        }

        function handleUrlKeyDown(event) {
            if (event.key === 'Enter') {
                navigateToUrl(event.target.value);
            }
        }

        function showMenu() {
            if (window.electronAPI) {
                window.electronAPI.showAbout();
            } else {
                alert('Menu functionality available in full Electron app!');
            }
        }

        async function showAbout() {
            if (window.electronAPI) {
                await window.electronAPI.showAbout();
            }
        }

        // Initialize with first tab when page loads
        document.addEventListener('DOMContentLoaded', () => {
            createNewTab();
        });
    </script>
</body>
</html>
